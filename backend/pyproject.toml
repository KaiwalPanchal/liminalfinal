[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "liminal-backend"
version = "0.1.0"
description = "Production Grounded Hybrid GraphRAG Backend for Liminal"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "neo4j>=5.14.0",
    "sentence-transformers>=2.2.0",
    "fastmcp>=0.1.0",
    "litellm>=1.20.0",
    "instructor>=1.0.0",
    "httpx>=0.24.0",
    "python-dotenv>=1.0.0",
    "cohere>=4.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "mcp*"]
